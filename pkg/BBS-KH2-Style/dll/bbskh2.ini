; BBS KH2-style mod - settings.  Read when the game starts.  Delete a line to get its default back.

[MP]
; MP at level 1, and how much the maximum grows per level after that
MaxAtLevel1=100
MaxPerLevel=0.5
; A command's MP cost is its original reload time in seconds times this (Fire 10, Firaga 15, Mega Flare 50 ...)
CostScale=1.0
; 1 = Cure, Cura and Curaga use up all remaining MP, as in KH2.  0 = they cost like any other command (30)
CureUsesAllMP=1
; MP burn: seconds to recharge from empty (Attack Haste / Magic Haste shorten it)
ChargeSeconds=20
; 1 = Ether, Mega-Ether, Elixir and Megalixir restore MP (50 / 100 / 100 / 100 percent) as well as Focus
EtherRestoresMP=1
; 1 = after a command is used the cursor moves on to the next one, as in the original game
CursorAdvance=0

[Bar]
Show=1
; Position of the bar's right end and top edge, in the game's own screen units (480 x 272), its size and length
RightX=425
TopY=249.5
Scale=0.9
Length=86
; Colours, as AABBGGRR hex (alpha 80 = solid; ff = full brightness for each of blue, green, red)
FillLeft=80ffb030
FillRight=80ff6000
Back=80401008
BurnLeft=80d880ff
BurnRight=80b030ff
BurnBack=80300828

[Bundle]
; The three earlier mods are built in.  0 switches one off.
; Combo Flow: walk out of attacks and spells early.  Camera: KH2-style camera.  Revenge Value: bosses take
; your combo until a hidden counter fills, then break out.
ComboFlow=1
Camera=1
RevengeValue=1

[Menu]
; KH2-style command menu (Attack / Magic / Item / Link).  0 = the original scrolling deck
Enabled=1
MagicText=Magic
ItemText=Item
LinkText=Link
; Positions in the game's screen units (480 x 272): the three extra entries, the Attack row, the lists
MainX=11
AttackY=197
MagicY=213
ItemY=228
LinkY=243
ListX=131
ListBottomY=243
ListPitch=15
