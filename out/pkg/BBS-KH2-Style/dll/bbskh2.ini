; BBS KH2-style mod - settings.  Read when the game starts.  Delete a line to get its default back.

[MP]
; Maximum MP = Baseline + MaxPerDeckSlot for every command deck slot the character has (filled or not; 3 at the
; start of the game, up to 8) + MaxPerLevel for every level above 1.  On Critical BaselineCritical is used instead
; of Baseline (50 MP at the start and 100 with all 8 slots, against 90 and 140 on the other difficulties).
Baseline=60
BaselineCritical=20
MaxPerDeckSlot=10
MaxPerLevel=0
; A command's MP cost is its original reload time in seconds (Quick Blitz 10, Mega Flare 50 ...; magic by tier, see
; TieredMagic) times this
CostScale=1.0
; 1 = magic costs are spread out by tier: Fire 10, Fira 15, Firaga 20, Dark Firaga 25 - every -ra spell 15, and
; every spell that was 15 / 20 costs 20 / 25.  0 = plain reload times (Fire and Fira both 10, Firaga 15 ...)
TieredMagic=1
; 1 = Cure, Cura and Curaga use up all remaining MP, as in KH2.  0 = they cost like any other command (30)
CureUsesAllMP=1
; The commands only D-Link decks have (Mickey's Holy, Cinderella's, the seven dwarfs, Vanitas's) all reload in 5
; seconds in the game.  1 = they cost by their class, as ordinary commands do - 10, 15 or 20 MP - and the two that
; heal (Cinderella's and Doc) count as cures: all remaining MP, or 30 with CureUsesAllMP=0.  0 = 5 MP each
DLinkCostByClass=1
; 1 = a D-Link can be started while the MP bar is recharging: a D-Link is not a command and costs no MP (the
; commands of its deck wait for the bar like any others).  0 = no new D-Link until the bar is back
DLinkDuringCharge=1
; 1 = starting a D-Link fills the MP bar, and ends an MP charge if one is running, as a Drive Form does in KH2.
; 0 = a D-Link leaves the bar as it is
DLinkRefillsMP=1
; MP burn: seconds to recharge from empty (Attack Haste / Magic Haste shorten it)
ChargeSeconds=20
; 1 = Ether, Mega-Ether, Elixir and Megalixir restore MP (50 / 100 / 100 / 100 percent) as well as Focus
EtherRestoresMP=1
; Standing on a save point refills MP, and finishes an MP charge, within this many seconds (0 = off)
SavePointSeconds=1
; 1 = after a command is used the cursor moves on to the next one, as in the original game
CursorAdvance=0

[Cost]
; MP cost of single commands, overriding everything above: <command id in hex>=<MP>, e.g. 83=12 for Fire.
; A cure with a cost here costs that and no longer takes all MP.
; (Ids: 83 Fire, 84 Fira, 85 Firaga, 8a Blizzard, 8e Thunder, 92 Cure, 9c Magnet, a2 Aero, ac Mega Flare ...
; D-Link only: e4 Holy, e5 Wish Circle, e6 Enchanted Step, e7 Wish Shot, e8 Cinderella's heal, e9 Doc, ea Grumpy,
; eb Sneezy, ec Happy, ed Sleepy, ee Bashful, ef Dopey, f0 Dark Spiral, f1 Dark Splicer)

[Bar]
Show=1
; 1 = KH2's own MP bar art (blue gradient bar with the "MP" plate at its right end).  0 = a plain bar
KH2Art=1
; 1 = the bar's left end is round, as in KH2.  0 = square
RoundEnd=1
; 1 = the bar is drawn at exactly the size and place set here.  0 = on the game's own grid for unscaled sprites
; (whole units of its 480 x 272 screen), as before this option: 8 high with borders of 1, and the round end and
; the "MP" plate do not line up with the rest
ExactSize=1
; Right end and top edge of the bar in the game's own screen units (480 x 272), and its thickness.  The Focus
; bar's outline ends at about y 253.9, so a Top above 254 runs into it.  (The first versions of the bar were
; Top 255.5, Height 7.5, BarLength 50.)
Right=425
Top=254.6
Height=4.5
; Length of the bar itself at 100 MP, and how much of any MP above 100 lengthens it (0 = fixed, 1 = in proportion).
; The "MP" plate adds 2.6 x Height to the right of it (57.6 + 11.7 = the 69.5 the first bar was long with its plate)
BarLength=57.6
Growth=0.4
; Tints, as AABBGGRR hex.  80 leaves the art's own colour, ff doubles it.  The letters and the recharge bar are
; grey in the art and get their colour here.
Fill=80808080
Label=80ff9030
Empty=80381810
Frame=80808080
BurnFill=80b860ff
BurnLabel=80c060ff
BurnEmpty=80280c20

[Combat]
; The minimum damage per hit that the game gives you with EXP Zero: a hit that would do less is raised to a
; minimum that depends on the enemy's maximum HP and on the kind of attack (basic attacks < commands and magic <
; the biggest commands).  Stronger hits are not changed.
; 1 = on Critical it applies all the time, with or without the ability   2 = the same on every difficulty
; 0 = only with EXP Zero equipped, as in the original game
DamageFloor=1

[Bundle]
; The three earlier mods are built in.  0 switches one off.
; Combo Flow: walk out of attacks and spells early.  Camera: KH2-style camera.  Revenge Value: bosses take
; your combo until a hidden counter fills, then break out.
ComboFlow=1
Camera=1
RevengeValue=1

[Menu]
; KH2-style command menu (Attack / Magic / Items / D-Link).  0 = the original scrolling deck
Enabled=1
; names of the three entries under Attack
MagicText=Magic
ItemText=Items
LinkText=D-Link
; Positions in the game's screen units (480 x 272): the three extra entries, the Attack row, the lists
MainX=4.5
; How far the entry under the cursor is shifted to the right
CursorShift=6
; ... and how strong the colour gradient inside its plate is, in percent (0 = none; its frame is solid either way)
CursorFill=100
AttackY=198
MagicY=213
ItemY=228
LinkY=243
; The "COMMANDS" window above the menu: how far it is moved from the game's own place (negative = up),
; and the position of the context prompt (Save, Talk, Open ...) above it
HeaderShift=-4.5
; 1 = keep the drop shadow under that window (it reaches into the Attack entry)
HeaderShadow=0
PromptX=2
PromptY=160
; how much higher prompts sit while a Command Style or a D-Link is active (their windows are taller than the plain one)
PromptStyleRaise=8
; a Command Style or finisher offer sits right above that window.  A context prompt that is up at the same time
; goes above the offer, this far (the height of the offer's plate); with no offer the prompt is at its own place
PromptAboveOffer=16
; 1 = a command that would empty the MP bar if used now has its name in another colour: Cure always, any other
; command when MP is too low for it.  The colour is AABBGGRR hex, 80 = full strength
BurnWarning=1
BurnWarningColor=ff107080
; 1 = context prompts (Talk, Open, Save, Examine ...) are answered with the triangle button, as KH2's reaction
; commands, and the attack button keeps attacking while one is up.  Counter prompts stay on the attack button.
; 0 = prompts take the attack button, as in the original game
ReactionButton=1
; 1 = d-pad right on Magic, Items or D-Link opens its list, as the confirm button does (d-pad left closes it)
RightOpensList=1
; 1 = with the Magic, Items or D-Link list open, the jump button closes the list and does not jump (as in KH2);
; it jumps again once the menu is back on its four entries.  0 = the jump button always jumps
JumpClosesList=1
; 1 = the description of a command in the menus (deck, shop, meld) ends with its MP cost in green ("MP All" for
; the Cure spells while CureUsesAllMP is on)
DescriptionCost=1
; 1 = the character panel of the menu (LV / HP / FP / NEXT LEVEL) shows MP between HP and FP.  The colour is
; AABBGGRR hex as it appears on screen (label, line and numbers); the default is the blue of KH2's MP bar
StatusMP=1
StatusMPColor=fff37e01
; The Magic / Items / D-Link list opens over the menu, as in KH1: ListX is its left edge (the menu's is MainX; 114
; puts it beside the menu, where it used to be).  Its first row takes the row of the entry it was opened from and the
; rest follow below; a list too long for the rows left under it ends on the menu's last row and grows upwards.
ListX=14
ListPitch=15
; 1 = a header with the list's name (MAGIC / ITEMS / D-LINK, on the game's "COMMANDS" plate) on the row above the
; list.  ListHeaderX / Y: its place from the first row's; ListHeaderWiden: how much longer than the "COMMANDS" plate
; it is, so that it is as long as the rows
ListHeader=1
ListHeaderX=-1.6
ListHeaderY=-9.1
ListHeaderWiden=24
; 1 = the four entries behind an open list are darkened, to ListDimLevel percent of their brightness
ListDimsMenu=1
ListDimLevel=50
; 1 = each list has a colour of its own, the same in battle and out of it: its header, its rows' frames and the
; fill of the row under the cursor.  0 = the game's colours (yellow in battle, blue outside).
; Colours are RRGGBB hex where 80 is the texture's own grey and ff twice as bright.  ...Color: the header's plate
; and the rows; ...TitleColor: the letters on the header.  MagicColor=005ff0 is the game's own blue.
; The D-Link rows keep the blue of the game's D-Link plates (it is part of their art); DLinkColor is the header's.
; DLinkRowsBright: 1 = D-Link rows not under the cursor are in full colour like the other lists' rows, 0 = dark as
; the game draws them
ListColors=1
MagicColor=005ff0
MagicTitleColor=00ffff
ItemsColor=00c832
ItemsTitleColor=c8ff64
DLinkColor=0096fa
DLinkTitleColor=ffffff
DLinkRowsBright=1
; The shortcut list (hold L1).  Its rows are the game's long plate with a tab for a button's picture on the left,
; in grey, the same in the field and in battle.  Colours are RRGGBB hex where 80 is the texture's own grey (ff is
; twice as bright): the frame and tab, the gradient inside, and the name of a command that cannot be used now
ShortcutColor=808080
ShortcutFill=606060
ShortcutDimText=404040
; centre of the button's picture inside the tab, in the plate's own units (the game's place for it is 11, 8), and
; extra width for the tab if the pictures of your keys need it
ShortcutIconX=11
ShortcutIconY=8
ShortcutPad=0
; an item in the shortcut list has the bottle icon of the Item rows at the right end of its plate (other commands
; have no icon there): how far right of its place on the ordinary plate it is drawn
ShortcutItemIconShift=11
; 1 = the "COMMANDS" window above the list is grey as well while the list is shown (a Command Style's or a D-Link's
; window keeps its own colours).  Its frame takes ShortcutColor; these are its label plate and the letters on it
ShortcutHeader=1
ShortcutHeaderPlate=707070
ShortcutHeaderText=ffffff
; time the D-Link list takes to move its cursor one step, in 1/30 s.  The game's is 10, and the list takes no
; input until the move is over; 0 = at once, so the list moves as fast as the Magic and Items lists
LinkCursorTime=0

[Shortcuts]
; Shortcuts as in KH2: hold L1 and the command menu turns into a list of four commands, each with its button
; (circle, triangle, square, cross - on keyboard and mouse, whatever is bound to those four); pressing one uses
; that command at once.  A shortcut belongs to a slot of the Command Deck, not to a command: put another command
; in the slot and the shortcut uses it.  They are set in the menu under Command Decks > Shortcuts and kept for
; each character in bbskh2_shortcuts.ini next to the game's exe (to begin with: the first four slots).
; 0 = no shortcuts, L1 as in the original game
Enabled=1
; L1 alone still turns the camera behind the character and, while locked on, changes the target - on a short
; press, when the button is let go.  A press longer than this many frames (60 a second) is not a tap
TapFrames=18
; a shortcut pressed while the character is busy is used as soon as possible within this many frames
BufferFrames=12
; the name of the entry in the Command Decks menu
MenuText=Shortcuts
; where a slot's button pictures go on its plate in that menu: right end and height of the pictures' anchor, in
; the plate's own units (the plate is 126 wide and 15 high; smaller Y = higher)
MenuIconX=123
MenuIconY=5.3

[Style]
; 1 = Command Styles and finishers are offers instead of being forced on you.  A full command gauge shows a prompt
; above the menu with the style button (the game's old deck-command button) and a timer.  Press it to change style
; / to use the finisher; Attack stays Attack meanwhile.  When a style offer runs out the finisher is offered; when
; that runs out too the gauge empties, as after a finisher.  0 = the game's own behaviour
Prompt=1
; how long the offer stands, in seconds
Seconds=6

[Speed]
; Pace of the player's actions.  0 = everything in this section off (the old Combo Flow walk-out is used instead)
Enabled=1
; Animation speed of attacks, attack commands, items and the recovery of spells (1 = the game's own; Haste is 2)
Actions=1.15
; 1 = a tilted stick ends an attack, command, item or spell as soon as it is done: last hit over, plus
; FollowThrough frames (1/30 s).  While the next hit of a combo can still be asked for, the stick has to change
; (tilt it, let go, or turn) - just holding it towards the enemy never cuts a combo short.
WalkOut=1
FollowThrough=3
; 1 = once an aerial attack is done the character falls at full gravity instead of hanging in the air (the game
; uses 16 % until the animation ends), and the short hover at the start of the fall is skipped
AirWeight=1
; ... and how long the buttons stay dead after an action that ended in the air, in 1/60 s (the game: 30)
AirLock=6
; 1 = attack lunges keep their reach at the higher speed
LungeFix=1
; Cast times taken from KH2: when the spell goes off, in seconds (0 = leave that family alone; a cast is never made
; slower than the original), and how long after that the next action can start, in 1/60 s (the game: 40 for all)
FireRelease=0.37
BlizzardRelease=0.27
ThunderRelease=0.30
CureRelease=0.30
FireFree=38
BlizzardFree=20
ThunderFree=24

[Safety]
; Off by default.  1 = before the game draws a piece of its 2D screens (HUD, menus), check that the picture it is
; about to use is still in memory; if it is not, the piece is drawn with its standard picture or left out for that
; frame instead of the game crashing, and bbskh2_log.txt says which piece it was.  It runs for every piece drawn,
; every frame.  The crash it was written for (the mod's menu left on screen when the game unloads its HUD) is
; fixed without it.
TextureGuard=0
